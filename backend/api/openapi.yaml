openapi: 3.0.3
info:
  title: Rush Hour Real Estate Platform API
  version: 1.0.0
  description: MVP платформы недвижимости - публичные эндпоинты

servers:
  - url: http://localhost:8080/api
    description: Local development server

paths:
  /areas:
    get:
      operationId: listAreas
      summary: Получить список районов
      tags:
        - Areas
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [boundary]
          description: Включить границы районов (GeoJSON)
      responses:
        "200":
          description: Список районов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
        "500":
          $ref: "#/components/responses/InternalError"

  /areas/{slug}:
    get:
      operationId: getArea
      summary: Получить район по slug
      tags:
        - Areas
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Район найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          $ref: "#/components/responses/NotFound"

  /cities:
    get:
      operationId: listCities
      summary: Получить список городов
      tags:
        - Cities
      responses:
        "200":
          description: Список городов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "500":
          $ref: "#/components/responses/InternalError"

  /filters/options:
    get:
      operationId: getFilterOptions
      summary: Получить опции фильтров
      tags:
        - Filters
      responses:
        "200":
          description: Опции фильтров
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterOptions"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects:
    get:
      operationId: listProjects
      summary: Получить список проектов
      tags:
        - Projects
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Фильтр по slug города
        - name: area
          in: query
          schema:
            type: string
          description: Фильтр по slug района
        - name: developer
          in: query
          schema:
            type: string
          description: Фильтр по slug застройщика
        - name: bedrooms
          in: query
          schema:
            type: string
          description: Фильтр по количеству спален (comma-separated, например "1,2,3" или "studio")
        - name: bathrooms
          in: query
          schema:
            type: string
          description: Фильтр по количеству ванных (comma-separated, например "1,2,3")
        - name: priceMin
          in: query
          schema:
            type: number
          description: Минимальная цена
        - name: priceMax
          in: query
          schema:
            type: number
          description: Максимальная цена
        - name: status
          in: query
          schema:
            type: string
            enum: [ready, construction, planning]
          description: Фильтр по статусу проекта
        - name: search
          in: query
          schema:
            type: string
          description: Поиск по названию проекта
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, newest, name_asc]
            default: name_asc
          description: Сортировка
      responses:
        "200":
          description: Список проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "500":
          $ref: "#/components/responses/InternalError"

  /projects/{slug}:
    get:
      operationId: getProject
      summary: Получить проект по slug
      tags:
        - Projects
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: includeLots
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 50
          description: Количество лотов для включения в ответ (0 = не включать)
      responses:
        "200":
          description: Проект найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /lots:
    get:
      operationId: listLots
      summary: Получить список лотов (каталог)
      tags:
        - Lots
      parameters:
        - name: area
          in: query
          schema:
            type: string
          description: Фильтр по slug района
        - name: project
          in: query
          schema:
            type: string
          description: Фильтр по slug проекта
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/LotType"
          description: Тип лота
        - name: bedrooms
          in: query
          schema:
            type: string
          description: Фильтр по количеству спален (comma-separated, например "1,2,3" или "studio")
        - name: bathrooms
          in: query
          schema:
            type: string
          description: Фильтр по количеству ванных (comma-separated, например "1,2,3")
        - name: priceMin
          in: query
          schema:
            type: number
          description: Минимальная цена
        - name: priceMax
          in: query
          schema:
            type: number
          description: Максимальная цена
        - name: areaMin
          in: query
          schema:
            type: number
          description: Минимальная площадь (м²)
        - name: areaMax
          in: query
          schema:
            type: number
          description: Максимальная площадь (м²)
        - name: bonus
          in: query
          schema:
            type: string
          description: Фильтр по ключу бонуса (например, goldenVisa)
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, area_desc, newest]
            default: newest
          description: Сортировка
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Номер страницы
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Количество элементов на странице
      responses:
        "200":
          description: Список лотов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotsListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /lots/{id}:
    get:
      operationId: getLot
      summary: Получить лот по ID
      tags:
        - Lots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Лот найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lot"
        "404":
          $ref: "#/components/responses/NotFound"

  /leads:
    post:
      operationId: createLead
      summary: Создать заявку (lead)
      tags:
        - Leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreateRequest"
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /developers:
    get:
      operationId: listDevelopers
      summary: Получить список застройщиков
      tags:
        - Developers
      responses:
        "200":
          description: Список застройщиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Developer"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/developers:
    get:
      operationId: adminListDevelopers
      summary: Получить список застройщиков (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      responses:
        "200":
          description: Список застройщиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Developer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: adminCreateDeveloper
      summary: Создать застройщика (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperCreateRequest"
      responses:
        "201":
          description: Застройщик создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/developers/{id}:
    get:
      operationId: adminGetDeveloper
      summary: Получить застройщика по ID (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Застройщик найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: adminSoftDeleteDeveloper
      summary: Мягкое удаление застройщика (установка deleted_at)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Застройщик помечен как удаленный
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: adminUpdateDeveloper
      summary: Обновить застройщика (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperUpdateRequest"
      responses:
        "200":
          description: Застройщик обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/developers/deleted:
    get:
      operationId: adminListDeletedDevelopers
      summary: Получить список удаленных застройщиков (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      responses:
        "200":
          description: Список удаленных застройщиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Developer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/developers/{id}/restore:
    post:
      operationId: adminRestoreDeveloper
      summary: Восстановить удаленного застройщика (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Застройщик восстановлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/developers/{id}/hard-delete:
    delete:
      operationId: adminHardDeleteDeveloper
      summary: Полное удаление застройщика (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Застройщик полностью удален
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/areas:
    get:
      operationId: adminListAreas
      summary: Получить список районов (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      responses:
        "200":
          description: Список районов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: adminCreateArea
      summary: Создать район (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaCreateRequest"
      responses:
        "201":
          description: Район создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/areas/{id}:
    get:
      operationId: adminGetArea
      summary: Получить район по ID (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Район найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: adminSoftDeleteArea
      summary: Мягкое удаление района (установка deleted_at)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Район помечен как удаленный
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: adminUpdateArea
      summary: Обновить район (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaUpdateRequest"
      responses:
        "200":
          description: Район обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/areas/deleted:
    get:
      operationId: adminListDeletedAreas
      summary: Получить список удаленных районов (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      responses:
        "200":
          description: Список удаленных районов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/areas/{id}/restore:
    post:
      operationId: adminRestoreArea
      summary: Восстановить удаленный район (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Район восстановлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/areas/{id}/hard-delete:
    delete:
      operationId: adminHardDeleteArea
      summary: Полное удаление района (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Район полностью удален
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/cities:
    get:
      operationId: adminListCities
      summary: Получить список городов (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      responses:
        "200":
          description: Список городов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: adminCreateCity
      summary: Создать город (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityCreateRequest"
      responses:
        "201":
          description: Город создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/cities/{id}:
