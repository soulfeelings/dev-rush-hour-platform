      operationId: adminGetCity
      summary: Получить город по ID (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Город найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
