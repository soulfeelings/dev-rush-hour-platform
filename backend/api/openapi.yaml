  schemas:

    Area:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        description:
          type: string
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
          enum: [active, inactive]
        data:
          $ref: "#/components/schemas/AreaData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    AreaData:
      type: object
      properties:
        boundary:
          $ref: "#/components/schemas/GeoJSONPolygon"
        center:
          $ref: "#/components/schemas/Point"
        zoom:
          type: integer
        bbox:
          $ref: "#/components/schemas/BoundingBox"
        seo:
          type: object
          additionalProperties: true

    GeoJSONPolygon:
      type: object
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
                minItems: 2
                maxItems: 2

    Point:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number

    BoundingBox:
      type: object
      properties:
        southWest:
          $ref: "#/components/schemas/Point"
        northEast:
          $ref: "#/components/schemas/Point"

    LotType:
      type: string
      enum: [apartment, villa, townhouse, penthouse, duplex, triplex]

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        sale:
          type: string
          enum: [sale, start of sales, sales announcement]
        developerId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        lat:
          type: number
        lng:
          type: number
        description:
          oneOf:
            - type: string
            - type: object
              additionalProperties:
                type: string
        featuresAmenities:
          type: array
          items:
            type: string
        media:
          $ref: "#/components/schemas/Media"
        isFeatured:
          type: boolean
          description: Избранный проект
        tags:
          type: array
          items:
            type: string
          description: Теги проекта
        youtubeUrl:
          type: string
          description: YouTube video URL for the project
        timeline:
          $ref: "#/components/schemas/ProjectTimeline"
        roi:
          type: number
          description: Return on Investment percentage
        priceFromUs:
          type: number
          description: Our company price (AED)
        priceFromDeveloper:
          type: number
          description: Original developer price (AED)
        paymentPlan:
          type: string
          description: Payment plan description
        completionDate:
          type: string
          description: Expected completion date (e.g., Q4 2025, 2026)
        currency:
          type: string
          description: Currency code (e.g., AED, USD)
        propertyTypes:
          type: array
          items:
            type: string
          description: Available property types
        bedrooms:
          type: array
          items:
            type: string
          description: Available bedroom configurations
        areaSize:
          type: number
          description: Area size
        areaUnit:
          type: string
          description: Unit for area measurement (sqm, sqft)
        pricesByType:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              price:
                type: number
          description: Prices broken down by property type
        developer:
          $ref: "#/components/schemas/Developer"
          description: Вложенный объект застройщика
        area:
          $ref: "#/components/schemas/Area"
          description: Вложенный объект района
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)
        lots:
          type: array
          items:
            $ref: "#/components/schemas/Lot"
          description: Первые N лотов проекта (если запрошено через includeLots)
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
          description: Бейджи проекта
        infrastructures:
          type: array
          items:
            $ref: "#/components/schemas/Infrastructure"
          description: Инфраструктура комплекса

    ProjectTimeline:
      type: object
      description: Project timeline with milestone dates
      properties:
        projectAnnouncement:
          type: string
          format: date
          description: Date of project announcement
        bookingStarted:
          type: string
          format: date
          description: Date when booking started
        constructionStarted:
          type: string
          format: date
          description: Date when construction started
        constructionProgress:
          type: string
          format: date
          description: Date of construction progress milestone
        constructionProgressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Construction progress percentage (0-100)
        expectedCompletion:
          type: string
          format: date
          description: Expected completion date

    Media:
      type: object
      properties:
        cover:
          $ref: "#/components/schemas/MediaItem"
        hover:
          $ref: "#/components/schemas/MediaItem"
          description: Hover image for the project card
        logo:
          $ref: "#/components/schemas/MediaItem"
          description: Project logo
        gallery:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"

    MediaItem:
      type: object
      properties:
        id:
          type: string
        url:
          type: string

    Lot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, hidden, reserved, sold]
        projectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/LotType"
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        areaSqm:
          type: number
        floor:
          type: integer
        priceFromUs:
          type: number
        priceFromDeveloper:
          type: number
        roi:
          type: number
        bonusKeys:
          type: array
          items:
            type: string
        badgeIds:
          type: array
          items:
            type: string
            format: uuid
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        data:
          $ref: "#/components/schemas/LotData"
        project:
          $ref: "#/components/schemas/Project"
          description: Вложенный объект проекта (если загружен)
        developer:
          $ref: "#/components/schemas/Developer"
          description: Вложенный объект застройщика из проекта (если загружен)
        area:
          $ref: "#/components/schemas/Area"
          description: Вложенный объект района из проекта (если загружен)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    LotData:
      type: object
      properties:
        media:
          $ref: "#/components/schemas/LotMedia"
        paymentPlan:
          $ref: "#/components/schemas/PaymentPlan"
        bonuses:
          type: array
          items:
            $ref: "#/components/schemas/Bonus"
        floorPosition:
          $ref: "#/components/schemas/FloorPosition"
        tags:
          type: array
          items:
            type: string
        view:
          type: string
        orientation:
          type: string

    LotMedia:
      type: object
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        floorPlanImages:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        viewPhotos:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        cover:
          $ref: "#/components/schemas/MediaItem"

    PaymentPlan:
      type: object
      properties:
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/PaymentScheduleItem"

    PaymentScheduleItem:
      type: object
      properties:
        stage:
          type: string
        percent:
          type: number
        amount:
          type: number
        dueDate:
          type: string

    Bonus:
      type: object
      properties:
        title:
          type: string
        style:
          type: string
        description:
          type: string

    FloorPosition:
      type: object
      properties:
        label:
          type: string
        x:
          type: number
        y:
          type: number

    LotListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, hidden, reserved, sold]
        projectId:
          type: string
          format: uuid
        developerId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/LotType"
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        areaSqm:
          type: number
        floor:
          type: integer
        priceFromUs:
          type: number
        priceFromDeveloper:
          type: number
        roi:
          type: number
        bonusKeys:
          type: array
          items:
            type: string
        badgeIds:
          type: array
          items:
            type: string
            format: uuid
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        data:
          $ref: "#/components/schemas/LotData"
        project:
          $ref: "#/components/schemas/Project"
          description: Вложенный объект проекта
        developer:
          $ref: "#/components/schemas/Developer"
          description: Вложенный объект застройщика
        area:
          $ref: "#/components/schemas/Area"
          description: Вложенный объект района
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    LotsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LotListItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    LeadCreateRequest:
      type: object
      required:
        - type
        - name
        - phone
      properties:
        type:
          type: string
          enum: [callback, viewing, details]
        source:
          type: string
        projectId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 255
        phone:
          type: string
          minLength: 5
          maxLength: 50
        email:
          type: string
          format: email
        data:
          $ref: "#/components/schemas/LeadDataRequest"

    LeadDataRequest:
      type: object
      properties:
        preferred:
          type: string
        comment:
          type: string
        pageUrl:
          type: string
        utm:
          type: object
          additionalProperties: true

    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [new, in_progress, done, spam]
        type:
          type: string
          enum: [callback, viewing, details]
        source:
          type: string
        projectId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        data:
          $ref: "#/components/schemas/LeadData"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    LeadData:
      type: object
      properties:
        preferred:
          type: string
        comment:
          type: string
        pageUrl:
          type: string
        utm:
          type: object
          additionalProperties: true

    LeadUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [new, in_progress, done, spam]
        type:
          type: string
          enum: [callback, viewing, details]
        source:
          type: string
        projectId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        data:
          $ref: "#/components/schemas/LeadData"

    Developer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        logoUrl:
          type: string
          description: URL логотипа застройщика
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    Badge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
          description: Hex color code for background (e.g. "#25D366")
        textColor:
          type: string
          description: Hex color code for text (e.g. "#FFFFFF")
        icon:
          type: string
          description: Icon name or URL
        iconColor:
          type: string
          description: Hex color code for icon (e.g. "#FFD400")
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    BadgeCreateRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
          default: "#000000"
        textColor:
          type: string
          default: "#FFFFFF"
        icon:
          type: string
        iconColor:
          type: string
          default: "#FFD400"
        sortOrder:
          type: integer
          default: 0

    BadgeUpdateRequest:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
        textColor:
          type: string
        icon:
          type: string
        iconColor:
          type: string
        sortOrder:
          type: integer

    Infrastructure:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
          description: Hex color code for background (e.g. "#25D366")
        textColor:
          type: string
          description: Hex color code for text (e.g. "#FFFFFF")
        icon:
          type: string
          description: Icon name or URL
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Время мягкого удаления (если null - не удален)

    InfrastructureCreateRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
          default: "#000000"
        textColor:
          type: string
          default: "#FFFFFF"
        icon:
          type: string
        sortOrder:
          type: integer
          default: 0

    InfrastructureUpdateRequest:
      type: object
      properties:
        slug:
          type: string
        name:
