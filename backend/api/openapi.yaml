        priceRanges:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/FilterOption"

    FilterOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string

    DeveloperCreateRequest:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
          default: active
        logoUrl:
