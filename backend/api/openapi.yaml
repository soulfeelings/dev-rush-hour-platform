            type: object
            properties:
              type:
                type: string
              price:
                type: number
          description: Prices broken down by property type
        badgeIds:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of badges for the project
        infrastructureIds:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of complex infrastructure for the project

    LotCreateRequest:
      type: object
      required:
        - projectId
        - type
        - priceFromUs
      properties:
        projectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/LotType"
        status:
          type: string
          enum: [active, hidden, reserved, sold]
          default: active
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        areaSqm:
          type: number
        floor:
          type: integer
        priceFromUs:
          type: number
        priceFromDeveloper:
          type: number
        roi:
          type: number
        bonusKeys:
          type: array
          items:
            type: string
        badgeIds:
          type: array
          items:
            type: string
            format: uuid
        data:
          $ref: "#/components/schemas/LotData"

    LotUpdateRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/LotType"
        status:
          type: string
          enum: [active, hidden, reserved, sold]
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        areaSqm:
          type: number
        floor:
          type: integer
        priceFromUs:
          type: number
        priceFromDeveloper:
          type: number
        roi:
          type: number
        bonusKeys:
          type: array
          items:
            type: string
        badgeIds:
          type: array
          items:
            type: string
            format: uuid
        data:
          $ref: "#/components/schemas/LotData"

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true

  responses:
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "not_found"
              message: "Resource not found"

    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "validation_error"
              message: "validation failed"
              details:
                name: "required"
                email: "invalid_email"

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "internal_error"
              message: "Internal server error"

    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "unauthorized"
              message: "Invalid or missing API key"

  securitySchemes:
    AdminApiKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: API ключ для доступа к админ-эндпоинтам
