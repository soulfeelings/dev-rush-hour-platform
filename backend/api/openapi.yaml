      summary: Мягкое удаление города (установка deleted_at)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Город помечен как удаленный
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: adminUpdateCity
      summary: Обновить город (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityUpdateRequest"
      responses:
        "200":
          description: Город обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/cities/deleted:
    get:
      operationId: adminListDeletedCities
      summary: Получить список удаленных городов (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      responses:
        "200":
          description: Список удаленных городов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/cities/{id}/restore:
    post:
      operationId: adminRestoreCity
      summary: Восстановить удаленный город (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Город восстановлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/cities/{id}/hard-delete:
    delete:
      operationId: adminHardDeleteCity
      summary: Полное удаление города (админ)
      tags:
        - Admin
      security:
        - AdminApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Город полностью удален
        "401":
          $ref: "#/components/responses/Unauthorized"
