version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/sqlc/queries/"
    schema: "internal/migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/sqlc/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              package: "uuid"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
              package: "uuid"
